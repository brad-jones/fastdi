[workspace]
platforms = ["linux-64"]
channels = ["https://prefix.dev/brads-forge", "conda-forge"]

[tasks]
init = "task init"

[tasks.code]
depends-on = ["init"]
cmd = "code ."

[target.unix.activation.env]
PATH = "$PIXI_PROJECT_ROOT/scripts:$PIXI_PROJECT_ROOT/.venv/bin:$PATH"

[dependencies]
age = ">=1.3.1,<2"
apm = ">=0.28.0,<0.29"
cocogitto = ">=7.0.0,<8"
dprint = ">=0.56.1,<0.57"
gh = ">=2.98.0,<3"
go-sops = ">=3.13.3,<4"
lefthook = ">=2.1.11,<3"
python = ">=3.14.7,<3.15"
task = ">=3.53.1,<4"
uv = ">=0.12.7,<0.13"
