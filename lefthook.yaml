# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/refs/heads/master/schema.json

pre-commit:
  scripts:
    "fix-script-execute-bit.py":
      runner: pixi run uv run
      stage_fixed: true
  commands:
    dprint:
      run: pixi run dprint fmt --allow-no-files {staged_files}
      stage_fixed: true
    lint:
      run: pixi run task lint

commit-msg:
  commands:
    lint:
      run: pixi run cog verify -f {1}
