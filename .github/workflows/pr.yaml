on:
  pull_request:
    branches:
      - master

env:
  CI: true

jobs:
  lint_n_test:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: ✨ Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.79.0
          activate-environment: true

      - name: 🛠️ Additional Initialization
        run: task init

      - parallel:
          - name: 📜 Lint Commit Messages
            run: try_cog_check.py

          - name: 👮 Enforce our code quality
            run: task lint

          - name: 🧪 Run Tests
            run: task test
